[project]
name = "fastapi-bookmark"
version = "0.1.0"
description = "Production FastAPI service for Moonbarq bookmarks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "pydantic-settings>=2,<3",
    "psycopg[binary]>=3.2,<4",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx",
    "mypy>=1.17,<2",
    "pip-audit>=2.9,<3",
    "pytest",
    "pytest-asyncio>=1,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: tests requiring external services",
]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 90
