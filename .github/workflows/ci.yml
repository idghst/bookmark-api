name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --dev
      - run: uv run python -m ruff format --check app tests
      - run: uv run python -m ruff check --no-cache app tests
      - run: uv run python -m mypy app
      - run: uv run python -m pytest --cov=app --cov-report=term-missing
      - run: uv run python -m pip_audit
