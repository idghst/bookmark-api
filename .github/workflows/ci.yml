name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: bookmark_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --dev
      - run: uv run ruff format --check app tests
      - run: uv run ruff check --no-cache app tests
      - run: uv run mypy app
      - run: uv run pytest -m "not integration" --cov=app --cov-report=term-missing
      - run: uv run pytest -m integration
        env:
          DATABASE_TEST_URL: postgresql://postgres@127.0.0.1:5432/bookmark_test
      - run: uv run pip-audit
